<script>

let currentIndex = 0;
let answerVisible = false;


// Display current card
function displayCard() {

    document.getElementById("question").innerText =
        flashcards[currentIndex].question;

    document.getElementById("answer").innerText =
        answerVisible ? flashcards[currentIndex].answer : "";

    document.getElementById("questionInput").value =
        flashcards[currentIndex].question;

    document.getElementById("answerInput").value =
        flashcards[currentIndex].answer;
}

function showAnswer() {

    answerVisible = !answerVisible;

    displayCard();
}

function nextCard() {

    currentIndex++;

    if (currentIndex >= flashcards.length) {
        currentIndex = 0;
    }

    answerVisible = false;

    displayCard();
}


// Previous card
function previousCard() {

    currentIndex--;

    if (currentIndex < 0) {
        currentIndex = flashcards.length - 1;
    }

    answerVisible = false;

    displayCard();
}

function addCard() {

    let question =
        document.getElementById("questionInput").value;

    let answer =
        document.getElementById("answerInput").value;

    if (question === "" || answer === "") {

        document.getElementById("message").innerText =
            "Please enter both question and answer.";

        return;
    }

    flashcards.push({
        question: question,
        answer: answer
    });

    currentIndex = flashcards.length - 1;

    answerVisible = false;

    document.getElementById("message").innerText =

    displayCard();
}

function editCard() {

    let question =
        document.getElementById("questionInput").value;

    let answer =
        document.getElementById("answerInput").value;

    if (question === "" || answer === "") {

        document.getElementById("message").innerText =
            "Please enter both question and answer.";

        return;

    flashcards[currentIndex].answer = answer;

    document.getElementById("message").innerText =
        "Flashcard updated successfully!";

    displayCard();
}


// Delete current card
function deleteCard() {

    if (flashcards.length === 1) {

        document.getElementById("message").innerText =
            "At least one flashcard must remain.";

        return;
    }

    flashcards.splice(currentIndex, 1);

    if (currentIndex >= flashcards.length) {
        currentIndex = flashcards.length - 1;
    }

    answerVisible = false;

    document.getElementById("message").innerText =
        "Flashcard deleted successfully!";

    displayCard();
}


// Load first card
displayCard();
